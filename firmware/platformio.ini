; Task Calendar firmware, ESP32-8048S070C (7.0" 800x480 capacitive, ESP32-S3 N16R8)
; See ../implementation_plan.md (Phase A3) and ../circuit_and_components.md

[platformio]
default_envs = esp32s3_8048s070c

; ---------------------------------------------------------------------------
; The real board
; ---------------------------------------------------------------------------
[env:esp32s3_8048s070c]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

; N16R8 module: 16MB QIO flash, 8MB octal PSRAM
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.filesystem = littlefs

build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1

monitor_speed = 115200
monitor_filters = esp32_exception_decoder

; ---------------------------------------------------------------------------
; Host-side unit tests (no board needed): data model, merge rules, HLC, ordering.
; Run with:  pio test -e native
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17 -Wall -Wextra
; Only pure C++ (no hardware) goes in src/model/. It is added here in Phase A4.
build_src_filter = -<*>
